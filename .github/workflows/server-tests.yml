name: server-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/core-2.0-hardening']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test
